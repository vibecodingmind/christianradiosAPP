name: christian_radios_app
description: Christian Radios — Live listener app for Android & iOS.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Audio streaming + background playback
  just_audio: ^0.9.43
  audio_service: ^0.18.15
  audio_session: ^0.1.25

  # State management
  flutter_riverpod: ^2.6.1

  # HTTP client
  dio: ^5.7.0

  # Local storage / offline cache
  hive_flutter: ^1.1.0

  # Navigation
  go_router: ^14.8.1

  # WebView (Prayers & Giving pages)
  webview_flutter: ^4.10.0

  # Image caching
  cached_network_image: ^3.4.1

  # Secure token storage
  flutter_secure_storage: ^9.2.4

  # Share station
  share_plus: ^10.1.4

  # Open payment checkout, websites, and stream homepages
  url_launcher: ^6.3.1

  # Icons
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
